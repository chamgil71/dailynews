name: Card News — Build & SNS Post

# ── 트리거 ──────────────────────────────────────────────────────────────────
on:
  # 각 채널 워크플로우 성공 완료 후 자동 실행
  workflow_run:
    workflows:
      - "Daily News Report"
      - "AI Issue Weekly Report"
      - "Stock Briefing Send"
      - "Weekly Stock Build"
    types: [completed]
  # 수동 실행
  workflow_dispatch:
    inputs:
      type:
        description: '채널 (news|ai-issue|stock)'
        required: false
        default: 'news'
      date:
        description: '날짜 (YYYY-MM-DD). 미입력 시 최신'
        required: false
      platforms:
        description: '발송 플랫폼 (쉼표 구분). 비우면 모드별 기본값(config/cardnews_themes.json sns.default_platforms)'
        required: false
        default: ''
      build_only:
        description: 'true: PNG만 생성, SNS 발송 건너뜀'
        required: false
        default: 'false'

concurrency:
  group: cardnews-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      TZ: Asia/Seoul
      # ── 발송 모드 스위치 ────────────────────────────────────────────────
      # text  : 카드 이미지 생성 중단 — HTML/PNG 빌드·커밋·CDN 대기 스텝 전부 건너뛰고
      #         SNS 에는 텍스트만 발송 (2026-09-29~ 현재 설정)
      # image : 카드뉴스 PNG 생성 + 이미지 포함 발송 (재개 시 이 값만 변경)
      CARDNEWS_MODE: text

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # ── 한국어 폰트 + Playwright ───────────────────────────────────────────
      - name: 한국어 폰트 설치
        if: env.CARDNEWS_MODE == 'image'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Playwright 설치
        if: env.CARDNEWS_MODE == 'image'
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # ── 채널 타입 결정 ──────────────────────────────────────────────────────
      - name: 채널 타입 결정
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ github.event.inputs.type }}"
            if [ -z "$TYPE" ]; then TYPE="news"; fi
          else
            TRIGGER="${{ github.event.workflow_run.name }}"
            case "$TRIGGER" in
              "Daily News Report")    TYPE="news" ;;
              "AI Issue Weekly Report") TYPE="ai-issue" ;;
              "Stock Briefing Send")  TYPE="stock" ;;
              "Weekly Stock Build")   TYPE="stock" ;;
              *)                      TYPE="news" ;;
            esac
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "채널: $TYPE"

      # ── 카드뉴스 HTML 빌드 ─────────────────────────────────────────────────
      - name: 카드뉴스 HTML 빌드
        if: env.CARDNEWS_MODE == 'image'
        run: |
          TYPE="${{ steps.channel.outputs.type }}"
          DATE="${{ github.event.inputs.date }}"
          ARGS="--type $TYPE"
          if [ -n "$DATE" ]; then ARGS="$ARGS --date $DATE"; fi
          python scripts/build_cardnews.py $ARGS
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}

      # ── PNG 이미지 생성 (Playwright → Noto Sans KR 렌더링) ─────────────────
      - name: PNG 이미지 생성
        if: env.CARDNEWS_MODE == 'image'
        run: |
          TYPE="${{ steps.channel.outputs.type }}"
          DATE="${{ github.event.inputs.date }}"
          ARGS="--type $TYPE"
          if [ -n "$DATE" ]; then ARGS="$ARGS --date $DATE"; fi
          python scripts/generate_cardnews_images.py $ARGS

      # ── PNG + HTML 커밋 & 푸시 ──────────────────────────────────────────────
      - name: 카드뉴스 파일 커밋
        if: env.CARDNEWS_MODE == 'image'
        run: |
          TYPE="${{ steps.channel.outputs.type }}"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git add -f publish/cardnews/$TYPE/
          git diff --staged --quiet || git commit -m "🖼️ Card news ($TYPE) $(date +'%Y-%m-%d')"
          git pull --rebase --autostash -X theirs origin main
          git push

      # ── GitHub Raw CDN 전파 대기 (SNS 발송 전 필수) ────────────────────────
      # Instagram/Threads/Facebook 은 GitHub Raw URL 로 이미지를 서버에서 직접 fetch
      # git push 직후 CDN 에 파일이 없으면 404 → API 업로드 실패
      # 최대 5분(20 × 15s) 대기 후 접근 가능 확인 시 발송 진행
      - name: GitHub CDN 전파 대기
        if: ${{ env.CARDNEWS_MODE == 'image' && github.event.inputs.build_only != 'true' }}
        run: |
          TYPE="${{ steps.channel.outputs.type }}"
          FIRST_PNG=$(ls publish/cardnews/$TYPE/*.png 2>/dev/null | sort | tail -1)
          if [ -z "$FIRST_PNG" ]; then
            echo "PNG 파일 없음 — CDN 대기 생략"
            exit 0
          fi
          FILENAME=$(basename "$FIRST_PNG")
          URL="https://raw.githubusercontent.com/chamgil71/dailynews/main/publish/cardnews/$TYPE/$FILENAME"
          echo "CDN 전파 확인 중: $URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "  시도 $i/20: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ CDN 전파 확인 완료 (${i}회차)"
              exit 0
            fi
            sleep 15
          done
          echo "⚠ 최대 대기 시간(5분) 초과 — 발송 계속 시도"

      # ── SNS 발송 (멀티 플랫폼) ────────────────────────────────────────────
      - name: SNS 발송
        id: sns
        if: ${{ github.event.inputs.build_only != 'true' }}
        run: |
          TYPE="${{ steps.channel.outputs.type }}"
          DATE="${{ github.event.inputs.date }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"

          # 플랫폼 미지정 시 post_cardnews.py 가 모드별 기본값(config) 사용
          ARGS="--type $TYPE --mode $CARDNEWS_MODE"
          if [ -n "$PLATFORMS" ]; then ARGS="$ARGS --platform $PLATFORMS"; fi
          if [ -n "$DATE" ]; then ARGS="$ARGS --date $DATE"; fi

          python scripts/post_cardnews.py $ARGS
        env:
          # Instagram (Graph API v21.0)
          INSTAGRAM_ACCESS_TOKEN:        ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          # Threads
          THREADS_ACCESS_TOKEN:          ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:               ${{ secrets.THREADS_USER_ID }}
          # Facebook Page
          META_PAGE_ACCESS_TOKEN:        ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:              ${{ secrets.FACEBOOK_PAGE_ID }}
          # Telegram
          TELEGRAM_BOT_TOKEN:            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:              ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_STOCK:        ${{ secrets.TELEGRAM_CHAT_ID_STOCK }}
          # Twitter/X
          TWITTER_API_KEY:               ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:            ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:          ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET:   ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          # 공통
          SITE_BASE_URL:                 ${{ secrets.SITE_BASE_URL }}
        continue-on-error: true

      # ── 발송 실패 시 텔레그램 알림 ───────────────────────────────────────────
      # 플랫폼별 실패 사유(post_cardnews.py → $GITHUB_OUTPUT detail)를 알림 본문에 포함.
      # detail 에는 외부 API 오류문이 들어가므로 ${{ }} 로 스크립트에 직접 넣지 않고 env 로 전달
      - name: 카드뉴스 발송 결과 알림
        if: always() && steps.sns.outcome == 'failure'
        run: |
          python scripts/notify_pipeline.py \
            --type cardnews \
            --status failure \
            --date $(TZ=Asia/Seoul date +'%Y-%m-%d') \
            --detail "$SNS_FAIL_DETAIL"
        env:
          SNS_FAIL_DETAIL:          ${{ steps.sns.outputs.detail }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_MONITOR: ${{ secrets.TELEGRAM_CHAT_ID_MONITOR }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
