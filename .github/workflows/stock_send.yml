name: Stock Briefing Send

# ── 트리거 ──────────────────────────────────────────────────────────────────
# 주 경로: KST 화~일 08:00 (UTC 23:00 월~토) — GitHub 스케줄 지연으로 실제 도착은 09~10시경
#   화~토: 전날 일일 리포트 (화=월 데이터 … 토=금 데이터)
#   일요일: 토요일 주간 루틴이 만든 주간 리포트 (weekly_YYYY-MM-DD.md, 토요일 날짜)
#   월요일: 실행 안 함
# 중복 방지: 직전 정기 실행 이전에 이미 올라와 있던 리포트는 재발송하지 않음
#   (scripts/select_stock_send_target.py — 보낸 기록 커밋 없이 git 이력 + Actions API로 판단)
# 수동:   workflow_dispatch 로 특정 날짜 재발송 가능 (요일·중복 규칙 미적용)
#
# 발송 흐름:
#   stock_build.yml / weekly_build.yml (리포트 push 시 HTML 빌드+배포)
#   → 이 워크플로우 (이메일·Notion·텔레그램 발송)
#   → 실제 발송한 경우에만 cardnews.yml 을 workflow_dispatch 로 호출 (SNS 발송)

on:
  schedule:
    - cron: '0 23 * * 1-6'    # UTC 23:00 월~토 = KST 08:00 화~일
  workflow_dispatch:
    inputs:
      date:
        description: '발송 날짜 (YYYY-MM-DD). 미입력 시 요일 규칙에 따라 자동 선택'
        required: false

permissions:
  contents: read
  actions: write   # 직전 실행 조회 + cardnews.yml 호출

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 리포트 최초 커밋 시각 조회용 (중복 발송 방지)
          filter: blob:none     # 이력만 받고 파일 본문은 필요할 때만 (용량 절감)

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # ── 발송 대상 리포트 확인 ──────────────────────────────────────────────
      - name: 발송 대상 리포트 확인
        id: find_report
        env:
          GH_TOKEN:    ${{ github.token }}
          INPUT_DATE:  ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python scripts/select_stock_send_target.py --date "$INPUT_DATE"
            exit 0
          fi
          # 직전 '정기' 실행의 시작 시각 (현재 실행 제외). 조회 실패 시 빈 값 → 보수적 규칙
          RUNS_API="repos/${{ github.repository }}/actions/workflows/stock_send.yml/runs"
          PREV=$(gh api "${RUNS_API}?event=schedule&status=success&per_page=5" \
                   --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].run_started_at // empty' \
                   2>/dev/null || true)
          echo "직전 정기 실행: ${PREV:-(알 수 없음)}"
          python scripts/select_stock_send_target.py --prev-run-at "$PREV"

      # ── 이메일 발송 (일일) ──────────────────────────────────────────────────
      - name: 이메일 발송 (일일)
        if: steps.find_report.outputs.exists == 'true' && steps.find_report.outputs.report_type == 'daily'
        run: python scripts/send_email.py --type stock --date ${{ steps.find_report.outputs.report_date }}
        env:
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS:     ${{ secrets.RECIPIENT_EMAILS }}
          SITE_BASE_URL:        ${{ secrets.SITE_BASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true

      # ── 이메일 발송 (주간) ──────────────────────────────────────────────────
      - name: 이메일 발송 (주간)
        if: steps.find_report.outputs.exists == 'true' && steps.find_report.outputs.report_type == 'weekly'
        run: python scripts/send_email.py --type weekly-stock --date ${{ steps.find_report.outputs.report_date }}
        env:
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS:     ${{ secrets.RECIPIENT_EMAILS }}
          SITE_BASE_URL:        ${{ secrets.SITE_BASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true

      # ── Notion 동기화 (일일만) ────────────────────────────────────────────
      - name: Notion 주식시황 동기화
        if: steps.find_report.outputs.exists == 'true' && steps.find_report.outputs.report_type == 'daily'
        run: |
          python scripts/sync_notion.py \
            --type stock \
            --date ${{ steps.find_report.outputs.report_date }}
        env:
          NOTION_API_KEY:                ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID_STOCK:      ${{ secrets.NOTION_DATABASE_ID_STOCK }}
        continue-on-error: true

      # ── 텔레그램 발송 (일일) ────────────────────────────────────────────────
      - name: 텔레그램 발송 (일일)
        if: steps.find_report.outputs.exists == 'true' && steps.find_report.outputs.report_type == 'daily'
        run: python scripts/send_telegram.py --type stock --date ${{ steps.find_report.outputs.report_date }}
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STOCK: ${{ secrets.TELEGRAM_CHAT_ID_STOCK }}
          SITE_BASE_URL:          ${{ secrets.SITE_BASE_URL }}
        continue-on-error: true

      # ── 텔레그램 발송 (주간) ────────────────────────────────────────────────
      - name: 텔레그램 발송 (주간)
        if: steps.find_report.outputs.exists == 'true' && steps.find_report.outputs.report_type == 'weekly'
        run: python scripts/send_telegram.py --type weekly-stock --date ${{ steps.find_report.outputs.report_date }}
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_STOCK: ${{ secrets.TELEGRAM_CHAT_ID_STOCK }}
          SITE_BASE_URL:          ${{ secrets.SITE_BASE_URL }}
        continue-on-error: true

      # ── 카드뉴스 SNS (실제 발송한 날만) ─────────────────────────────────────
      # cardnews.yml 은 더 이상 이 워크플로우의 완료(workflow_run)로 자동 실행되지 않는다.
      # 발송 대상이 없어 건너뛴 날(휴장·중복)에는 SNS 도 나가지 않도록 여기서만 호출.
      - name: 카드뉴스 SNS 트리거
        if: steps.find_report.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cardnews.yml --ref main \
            -f type=stock \
            -f date=${{ steps.find_report.outputs.report_date }}
        continue-on-error: true
